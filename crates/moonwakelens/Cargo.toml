[package]
name = "moonwakelens"
version.workspace = true
edition.workspace = true
description = "MoonwakeLens desktop app: YouTube trend research dashboard with a built-in MCP server and self-update"

[dependencies]
anyhow.workspace = true
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
moonwakelens-core = { path = "../moonwakelens-core" }

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "MoonwakeLens"
path = "src/main.rs"
