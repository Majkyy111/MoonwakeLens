[package]
name = "moonwakelens-core"
version.workspace = true
edition.workspace = true
description = "YouTube research engine: trends, outliers, keywords, tags, SEO and channel audits from public YouTube data"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "cookies"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
