[workspace]
resolver = "2"
members = ["crates/moonwakelens-core", "crates/MoonwakeLens"]

[workspace.package]
version = "0.4.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
